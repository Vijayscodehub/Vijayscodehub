<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Vijay Mistry: What I work on</title>
  <desc>Six focus areas: Machine Learning and AI, Computer Vision, Sensor Fusion, ADAS and Autonomous Driving, SLAM, Reinforcement Learning</desc>

  <style>
    .card  { fill: #ffffff; stroke: #d0d7de; stroke-width: 0.75; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #24292f; }
    .sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #57606a; }
    .emoji { font-size: 20px; }
    @media (prefers-color-scheme: dark) {
      .card  { fill: #161b22; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
    }
  </style>

  <!-- 6 cards, width 100, gap 13, start x = 10. Titles use a two-line slot (y 72/86, single line at 79); details at y 104/118/132 -->

  <!-- 1. Machine Learning & AI -->
  <rect x="10" y="10" width="100" height="140" rx="8" class="card"/>
  <rect x="10" y="10" width="100" height="4" rx="2" fill="#EE4C2C"/>
  <text x="60" y="46" text-anchor="middle" class="emoji">🧠</text>
  <text x="60" y="72" text-anchor="middle" class="title">Machine</text>
  <text x="60" y="86" text-anchor="middle" class="title">Learning &amp; AI</text>
  <text x="60" y="104" text-anchor="middle" class="sub">PyTorch · NumPy</text>
  <text x="60" y="118" text-anchor="middle" class="sub">Built from scratch</text>
  <text x="60" y="132" text-anchor="middle" class="sub">Error analysis</text>

  <!-- 2. Computer Vision -->
  <rect x="123" y="10" width="100" height="140" rx="8" class="card"/>
  <rect x="123" y="10" width="100" height="4" rx="2" fill="#5C3EE8"/>
  <text x="173" y="46" text-anchor="middle" class="emoji">👁️</text>
  <text x="173" y="79" text-anchor="middle" class="title">Computer Vision</text>
  <text x="173" y="104" text-anchor="middle" class="sub">YOLO · Detection</text>
  <text x="173" y="118" text-anchor="middle" class="sub">SegFormer</text>
  <text x="173" y="132" text-anchor="middle" class="sub">ByteTrack</text>

  <!-- 3. Sensor Fusion -->
  <rect x="236" y="10" width="100" height="140" rx="8" class="card"/>
  <rect x="236" y="10" width="100" height="4" rx="2" fill="#1D9E75"/>
  <text x="286" y="46" text-anchor="middle" class="emoji">📡</text>
  <text x="286" y="79" text-anchor="middle" class="title">Sensor Fusion</text>
  <text x="286" y="104" text-anchor="middle" class="sub">Camera · Radar</text>
  <text x="286" y="118" text-anchor="middle" class="sub">LiDAR projection</text>
  <text x="286" y="132" text-anchor="middle" class="sub">Depth · TTC</text>

  <!-- 4. ADAS & Autonomous Driving -->
  <rect x="349" y="10" width="100" height="140" rx="8" class="card"/>
  <rect x="349" y="10" width="100" height="4" rx="2" fill="#378ADD"/>
  <text x="399" y="46" text-anchor="middle" class="emoji">🚗</text>
  <text x="399" y="72" text-anchor="middle" class="title">ADAS &amp;</text>
  <text x="399" y="86" text-anchor="middle" class="title" style="font-size:10px">Autonomous Driving</text>
  <text x="399" y="104" text-anchor="middle" class="sub">AEB · NCAP</text>
  <text x="399" y="118" text-anchor="middle" class="sub">Simulation</text>
  <text x="399" y="132" text-anchor="middle" class="sub">MCAP · ROS 1/2</text>

  <!-- 5. SLAM -->
  <rect x="462" y="10" width="100" height="140" rx="8" class="card"/>
  <rect x="462" y="10" width="100" height="4" rx="2" fill="#D85A30"/>
  <text x="512" y="46" text-anchor="middle" class="emoji">🗺️</text>
  <text x="512" y="79" text-anchor="middle" class="title">SLAM</text>
  <text x="512" y="104" text-anchor="middle" class="sub">Radar SLAM</text>
  <text x="512" y="118" text-anchor="middle" class="sub">Factor graphs</text>
  <text x="512" y="132" text-anchor="middle" class="sub">Point clouds</text>

  <!-- 6. Reinforcement Learning -->
  <rect x="575" y="10" width="100" height="140" rx="8" class="card"/>
  <rect x="575" y="10" width="100" height="4" rx="2" fill="#0081A5"/>
  <text x="625" y="46" text-anchor="middle" class="emoji">🎯</text>
  <text x="625" y="72" text-anchor="middle" class="title">Reinforcement</text>
  <text x="625" y="86" text-anchor="middle" class="title">Learning</text>
  <text x="625" y="104" text-anchor="middle" class="sub">PPO · Gymnasium</text>
  <text x="625" y="118" text-anchor="middle" class="sub">Adaptive cruise</text>
  <text x="625" y="132" text-anchor="middle" class="sub">Control</text>
</svg>
